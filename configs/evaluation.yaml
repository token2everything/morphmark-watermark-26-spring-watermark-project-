model:
  name: "facebook/opt-1.3b"
  device: "cuda"
  torch_dtype: "float16"

generation:
  max_new_tokens: 200
  temperature: 0.7
  top_p: 0.9
  do_sample: true
  no_repeat_ngram_size: 4
  prompt_tokens: 30

detection:
  method: "zscore"
  gamma: 0.5

data:
  dataset: "c4"
  num_samples: 400
  seed: 42
